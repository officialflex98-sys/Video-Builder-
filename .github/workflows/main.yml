name: Build Video

on:
  push:
    branches: [main]
    paths:
      - "script.txt"
      - "Build_video.py"
      - "generate_voiceover.py"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (required by moviepy)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install moviepy requests google-genai

      - name: Generate voiceover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_voiceover.py

      - name: Run video builder
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python Build_video.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
          retention-days: 7
